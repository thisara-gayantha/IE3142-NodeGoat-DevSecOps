name: DevSecOps Security Pipeline

# Minimum permissions required by the workflow.
permissions:
  contents: read

on:
  # Run the complete DevSecOps pipeline on every push to every branch.
  push: {}

  # Also run when a pull request targets the main branch.
  pull_request:
    branches:
      - main

jobs:
  # ------------------------------------------------------------
  # 1. Build and Unit Tests
  # ------------------------------------------------------------
  build-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      MONGODB_URI: ${{ secrets.NODEGOAT_MONGODB_URI }}
      SESSION_SECRET: ${{ secrets.NODEGOAT_COOKIE_SECRET }}
      CRYPTO_KEY: ${{ secrets.NODEGOAT_CRYPTO_KEY }}
      ZAP_API_KEY: ${{ secrets.NODEGOAT_ZAP_API_KEY }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Run unit tests
        run: npm test

  # ------------------------------------------------------------
  # 2. Static Application Security Testing - Semgrep
  # ------------------------------------------------------------
  semgrep-sast:
    name: SAST - Semgrep
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Semgrep scan
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            semgrep/semgrep \
            semgrep scan \
            --config auto \
            /src \
            --exclude node_modules \
            --exclude .git \
            --exclude evidence

  # ------------------------------------------------------------
  # 3. Software Composition Analysis - npm audit
  # ------------------------------------------------------------
  dependency-scan:
    name: Dependency Scan - npm audit (Informational)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Run npm audit
        run: |
          echo "NodeGoat is an intentionally vulnerable legacy application."
          echo "npm audit findings are retained as security evidence, but this"
          echo "scan is informational because some legacy dependency findings"
          echo "cannot be removed without substantially changing the educational baseline."

          npm audit --audit-level=high || true

  # ------------------------------------------------------------
  # 4. Secrets Scanning - Gitleaks
  #
  # This is the mandatory BLOCKING SECURITY GATE.
  # The job fails if Gitleaks detects a secret in the current tree.
  # ------------------------------------------------------------
  secrets-scan:
    name: Secrets Scan - Gitleaks (BLOCKING GATE)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Run Gitleaks
        run: |
          docker run --rm \
            -v "$PWD:/path" \
            zricethezav/gitleaks:latest \
            detect \
            --no-git \
            --source="/path" \
            --verbose \
            --redact

  # ------------------------------------------------------------
  # 5. Container Image Security Scanning - Trivy
  # ------------------------------------------------------------
  container-scan:
    name: Container Scan - Trivy (Informational)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t nodegoat-devsecops:ci .

      - name: Run Trivy image scan
        run: |
          echo "NodeGoat uses a legacy container baseline that may contain"
          echo "known HIGH or CRITICAL vulnerabilities."
          echo "Trivy findings are therefore reported as security evidence"
          echo "without blocking the pipeline."

          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest \
            image \
            --exit-code 0 \
            --severity HIGH,CRITICAL \
            nodegoat-devsecops:ci
