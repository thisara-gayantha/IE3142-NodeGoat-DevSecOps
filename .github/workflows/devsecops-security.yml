name: DevSecOps Security Pipeline

on:
  push:
    branches: [ main, "feat/**", "fix/**" ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install dependencies
        run: npm install
      - name: Run unit tests
        run: npm test

  semgrep-sast:
    name: SAST - Semgrep (report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: docker run --rm -v "$PWD:/src" semgrep/semgrep semgrep scan --config auto /src --exclude node_modules --exclude .git --exclude evidence

  dependency-scan:
    name: Dependency Scan - npm audit (report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Install dependencies
        run: npm install
      - name: npm audit (informational)
        run: |
          echo "NodeGoat is an intentionally vulnerable legacy app. Some dependency findings cannot be remediated without breaking it, so npm audit is run as an informational report and is not used to block the build."
          npm audit --audit-level=high || true

  secrets-scan:
    name: Secrets Scan - Gitleaks (BLOCKING GATE)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Gitleaks on current tree
        run: |
          docker run --rm -v "$PWD:/path" zricethezav/gitleaks:latest detect --no-git --source="/path" --verbose --redact

  container-scan:
    name: Container Scan - Trivy (report)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t nodegoat-devsecops:ci .
      - name: Trivy image scan (informational)
        run: |
          echo "Base image node:12-alpine is EOL and carries HIGH/CRITICAL CVEs. Findings are reported here; upgrading the base image is documented as future remediation."
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:latest image --severity HIGH,CRITICAL nodegoat-devsecops:ci
